name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: only read the repository
permissions:
  contents: read

jobs:
  test:
    name: Test (Zig 0.17.1)
    # Linux-only: the box links X11/GL system libraries, and the macOS
    # (frameworks) and Windows branches of addRaylib are untested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check formatting
        run: zig fmt --check src build.zig

      - name: Run tests
        run: zig build test --summary all

      # Smoke check: assemble/compile every example through the freshly
      # built toolchain (no raylib or windowing needed).
      - name: Build examples
        run: zig build examples

      - name: Install box system libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxcursor-dev

      # The test and examples steps only touch the 4a/4c/4d tools; build
      # everything (including the 4b box with its C and raylib sources)
      # so box/C-ABI drift fails here instead of only locally.
      - name: Build all
        run: zig build --summary all

      # Run the freshly built box headless: no display needed, and it
      # exercises ROM loading, the embedded assembler/compiler, tick
      # and dump paths end to end.
      - name: Smoke-test box headless
        run: |
          for rom in examples/*.4b; do
            ./zig-out/bin/4b -d 100 "$rom" > /dev/null
          done
          ./zig-out/bin/4b -d 100 examples/move.4c > /dev/null
          ./zig-out/bin/4b -d 100 examples/fill.4a > /dev/null
